model: B2
num_transformer_layers: 4
p3_mode: C
seed: 42
img_size: 448
batch_size: 14
num_workers: 2
epochs: 35
stage1_epochs: 17
warmup_epochs: 3
patience: 8
two_stage: true
lr: 0.0001
sage_lr: 0.0002
p3_lr: 0.0001
gamma_init: 0.01
stage2_base_lr: 0.0001
stage2_shared_lr: 0.0001
stage2_p3_lr: 0.0001
stage2_sage_lr: 0.0001
output_dir: results/phase6_combination/phase6_comb_stage2a_a1_b1
mask_suffix: ''
smart_filter: true
crop_mode: random
ab_bpl_weight: 0.04
ab_bpl_dilation: 2
boundary_iou_weight: 0.5
boundary_iou_dilation: 2
sage_config:
  top_k: 2
  gating_type: sigmoid
  shared_expert_indices:
  - 0
  - 1
  - 2
  - 3
  router_hidden_dim: 64
  load_balance_factor: 0.01
  logit_modulation: true
  expert_dropout: 0.1
  fusion_type: residual
  residual_scale: 0.1
root_dir: /content/dataset/Crack500
train:
  images: train/images
  masks: train/masks
val:
  images: val/images
  masks: val/masks
test:
  images: test/images
  masks: test/masks
